<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vyjmenovaná slova</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #9B59B6;
            --success: #2ECC71;
            --danger: #E74C3C;
            --bg: #F0F4F8;
            --text: #2C3E50;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            /* Čistý sans-serif font vhodný pro děti a dyslektiky - slova se neslévají */
            font-family: 'Verdana', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #menu, #game {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 95%;
            max-width: 650px;
            position: relative;
        }

        #game {
            display: none;
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .cat-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #8E44AD;
            transition: all 0.1s;
            font-weight: bold;
        }
        
        .cat-btn.all-btn {
            grid-column: span 3;
            background-color: var(--primary);
            box-shadow: 0 5px 0 #357ABD;
        }

        .cat-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0;
        }

        #score-container {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #F1C40F;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #stats-bar {
            font-size: 1.2rem;
            color: var(--text);
            text-shadow: none;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .stat-good { color: var(--success); font-weight: bold; }
        .stat-bad { color: var(--danger); font-weight: bold; }
        .stat-percent { color: var(--primary); font-weight: bold; }

        #back-btn {
            font-size: 1rem;
            background: #95A5A6;
            color: white;
            border: none;
            padding: 8px 15px;
            box-shadow: 0 4px 0 #7F8C8D;
            border-radius: 10px;
            cursor: pointer;
        }
        
        #back-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #7F8C8D;
        }

        #word-container {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 20px 0;
            min-height: 90px;
            display: block; /* Změna z flex na block, aby se slova nerozdělovala přesně uprostřed kvůli spanům */
            text-align: center;
            line-height: 1.4;
        }

        /* Obaluje část slova s mezerou, aby se nerozlomilo slovo uvnitř */
        .nowrap-word {
            white-space: nowrap;
        }

        #blank {
            color: var(--primary);
            border-bottom: 4px solid var(--primary);
            min-width: 40px;
            display: inline-block;
            margin: 0 2px;
            text-align: center;
        }

        #hint {
            font-size: 1.3rem;
            color: #7F8C8D;
            margin-bottom: 30px;
            min-height: 35px;
            font-style: italic;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        button.guess-btn {
            flex: 1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 20px;
            font-size: 3rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 0 #357ABD;
            transition: all 0.1s;
            font-family: inherit;
        }

        button.guess-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #357ABD;
        }

        .success-anim { animation: pop 0.5s ease-out; }
        .error-anim { animation: shake 0.5s; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); color: var(--success); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        
        #feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Co budeme trénovat?</h1>
        <p>Vyber si písmenko, Klárko!</p>
        <div class="category-grid">
            <button class="cat-btn" onclick="startGame('B')">B</button>
            <button class="cat-btn" onclick="startGame('L')">L</button>
            <button class="cat-btn" onclick="startGame('M')">M</button>
            <button class="cat-btn" onclick="startGame('P')">P</button>
            <button class="cat-btn" onclick="startGame('S')">S</button>
            <button class="cat-btn" onclick="startGame('V')">V</button>
            <button class="cat-btn" onclick="startGame('Z')">Z</button>
            <button class="cat-btn all-btn" onclick="startGame('ALL')">VŠECHNA SLOVA</button>
        </div>
    </div>

    <div id="game">
        <div id="score-container">
            <button id="back-btn" onclick="showMenu()">↩ Zpět</button>
            <div id="stats-bar">
                <span class="stat-good" id="stat-correct">0</span> / 
                <span class="stat-bad" id="stat-wrong">0</span>
                <span class="stat-percent" id="stat-perc">0%</span>
            </div>
            <div>⭐ <span id="score">0</span></div>
        </div>
        
        <!-- Prefix a Suffix jsou rozděleny na slova před a slova s doplňkem, aby to nedělalo ošklivé zlomy -->
        <div id="word-container">
            <span id="prefix-words"></span>
            <span class="nowrap-word"><span id="prefix-part"></span><span id="blank">_</span><span id="suffix-part"></span></span>
            <span id="suffix-words"></span>
        </div>
        
        <div id="hint"></div>
        <div class="buttons">
            <button class="guess-btn" id="btn-i" onclick="guess('i')">i / í</button>
            <button class="guess-btn" id="btn-y" onclick="guess('y')">y / ý</button>
        </div>
        
        <div id="feedback-overlay"></div>
    </div>

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showMenu() {
            document.getElementById('game').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
        }

            document.getElementById('score').innerText = score;
            document.getElementById('stat-correct').innerText = totalCorrect;
            document.getElementById('stat-wrong').innerText = totalWrong;
            
            const totalGuesses = totalCorrect + totalWrong;
            const perc = totalGuesses === 0 ? 0 : Math.round((totalCorrect / totalGuesses) * 100);
            document.getElementById('stat-perc').innerText = perc + '%';
        }

            updateStats();
            refillQueue();
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            
            loadNextWord();
        }

        function refillQueue() {
            let listToPlay = [];
            if (currentCategory === 'ALL') {
                listToPlay = [...allWords];
            } else {
                listToPlay = allWords.filter(w => w.cat === currentCategory);
            }
            wordQueue = shuffle(listToPlay);
        }

        function loadNextWord() {
            if (wordQueue.length === 0) refillQueue();
            
            currentWord = wordQueue.pop();
            
            // Logika, aby se slova s "mezerou" nelámala uvnitř doplňovaného slova
            // Rozdělíme prefix a suffix podle poslední/první mezery
            
            const prefixArr = currentWord.fullPrefix.split(" ");
            const prefixPart = prefixArr.pop(); // slovo s podtržítkem
            const prefixWords = prefixArr.join(" "); // zbytek věty před ním
            
            const suffixArr = currentWord.fullSuffix.split(" ");
            const suffixPart = suffixArr.shift(); // konec slova s podtržítkem
            const suffixWords = suffixArr.join(" "); // zbytek věty za ním

            document.getElementById('prefix-words').innerText = prefixWords ? prefixWords + " " : "";
            document.getElementById('prefix-part').innerText = prefixPart;
            
            document.getElementById('suffix-part').innerText = suffixPart;
            document.getElementById('suffix-words').innerText = suffixWords ? " " + suffixWords : "";
            
            document.getElementById('hint').innerText = currentWord.hint;
            
            const blank = document.getElementById('blank');
            blank.innerText = '_';
            blank.style.color = 'var(--primary)';
        }

        function guess(letter) {
            const overlay = document.getElementById('feedback-overlay');
            const gameBox = document.getElementById('game');
            const blank = document.getElementById('blank');

            if (letter === currentWord.correct) {
                score += 1;
                totalCorrect += 1;
                updateStats();
                
                blank.innerText = currentWord.displayCorrect;
                blank.style.color = 'var(--success)';
                gameBox.classList.add('success-anim');
                
                overlay.innerText = '🎉';
                overlay.style.display = 'flex';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                    gameBox.classList.remove('success-anim');
                    loadNextWord();
                }, 1000);
            } else {
                totalWrong += 1;
                updateStats();
                
                gameBox.classList.add('error-anim');
                overlay.innerText = '❌';
                overlay.style.display = 'flex';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                    gameBox.classList.remove('error-anim');
                }, 800);
            }
        }
    </script>
</body>
</html>
